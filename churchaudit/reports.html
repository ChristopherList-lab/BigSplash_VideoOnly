<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bigsplash Audit Reports</title>
<link rel="icon" href="logo.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #131318;
    --bg-2: #1c1c23;
    --bg-3: #25252e;
    --line: #2f2f3a;
    --ink: #ddd8ce;
    --ink-soft: #8f8a82;
    --primary: #eff88b;
    --primary-ink: #131318;
    --secondary: #ddd8ce;
    --good: #eff88b;
    --warn: #f5c266;
    --bad: #ff6b6b;
    --display: "Anton", Impact, sans-serif;
    --body: "Inter", -apple-system, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--body);
    background: var(--bg);
    color: var(--ink);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  header.hero {
    background: var(--bg);
    border-bottom: 1px solid var(--line);
    padding: 24px;
  }
  .hero-inner {
    max-width: 1100px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .hero-logo { width: 44px; height: 44px; }
  .hero-logo img { width: 100%; height: 100%; display: block; }
  .hero-text h1 {
    margin: 0;
    font-family: var(--display);
    font-size: 28px;
    color: var(--primary);
    text-transform: uppercase;
  }
  .hero-text p {
    margin: 4px 0 0;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .nav-link {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
    text-decoration: none;
    padding: 8px 14px;
    border: 1px solid var(--line);
    border-radius: 8px;
  }
  .nav-link:hover { color: var(--primary); border-color: var(--primary); }

  main {
    max-width: 1100px;
    margin: 24px auto 80px;
    padding: 0 24px;
  }

  .toolbar {
    display: flex;
    gap: 10px;
    margin-bottom: 18px;
    align-items: center;
    flex-wrap: wrap;
  }
  #search {
    flex: 1;
    min-width: 240px;
    padding: 11px 14px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--bg-2);
    color: var(--ink);
    font-family: var(--body);
    font-size: 14px;
  }
  #search:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(239,248,139,0.15);
  }
  .ghost-btn, .primary-btn {
    background: var(--bg-2);
    border: 1px solid var(--line);
    color: var(--ink-soft);
    padding: 10px 16px;
    border-radius: 8px;
    font-family: var(--mono);
    font-size: 11px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .ghost-btn:hover { color: var(--primary); border-color: var(--primary); }
  .primary-btn {
    background: var(--primary);
    color: var(--primary-ink);
    border-color: var(--primary);
    font-weight: 700;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 14px;
  }
  .audit-card {
    background: var(--bg-2);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 18px;
    cursor: pointer;
    transition: border-color 0.15s, transform 0.05s;
  }
  .audit-card:hover { border-color: var(--primary); }
  .audit-card:active { transform: translateY(1px); }
  .ac-church {
    font-family: var(--display);
    font-size: 22px;
    color: var(--secondary);
    text-transform: uppercase;
    letter-spacing: 0.01em;
    margin: 0 0 4px;
  }
  .ac-meta {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-soft);
    margin-bottom: 14px;
    letter-spacing: 0.04em;
  }
  .ac-score-row {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  .ac-score {
    font-family: var(--display);
    font-size: 36px;
    line-height: 1;
  }
  .ac-score.good { color: var(--good); }
  .ac-score.warn { color: var(--warn); }
  .ac-score.bad { color: var(--bad); }
  .ac-score-lbl {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--ink-soft);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .type-badge {
    display: inline-block;
    font-family: var(--mono);
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.1em;
    padding: 3px 8px;
    border-radius: 999px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .type-badge.full { background: var(--primary); color: var(--primary-ink); }
  .type-badge.digital { background: var(--bg-3); color: var(--primary); border: 1px solid var(--primary); }
  #typeFilter {
    background: var(--bg-2);
    border: 1px solid var(--line);
    color: var(--ink);
    padding: 10px 14px;
    border-radius: 8px;
    font-family: var(--mono);
    font-size: 11px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  #typeFilter:focus { outline: none; border-color: var(--primary); }

  .empty, .loading {
    text-align: center;
    padding: 80px 20px;
    color: var(--ink-soft);
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  /* ---- Report view ---- */
  .report-wrap {
    background: var(--bg-2);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 32px;
  }
  .report-head {
    border-bottom: 1px solid var(--line);
    padding-bottom: 20px;
    margin-bottom: 24px;
    display: flex;
    align-items: flex-start;
    gap: 24px;
    flex-wrap: wrap;
  }
  .report-head .left { flex: 1; min-width: 250px; }
  .report-head h1 {
    margin: 0 0 8px;
    font-family: var(--display);
    font-size: 36px;
    color: var(--primary);
    text-transform: uppercase;
  }
  .report-head .meta {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--ink-soft);
    line-height: 1.7;
    letter-spacing: 0.03em;
  }
  .report-head .meta strong { color: var(--ink); }
  .report-head .overall {
    text-align: right;
    flex-shrink: 0;
  }
  .report-head .overall-num {
    font-family: var(--display);
    font-size: 80px;
    line-height: 0.9;
  }
  .report-head .overall-num.good { color: var(--good); }
  .report-head .overall-num.warn { color: var(--warn); }
  .report-head .overall-num.bad { color: var(--bad); }
  .report-head .overall-lbl {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .summary-block {
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 18px 22px;
    margin-bottom: 28px;
  }
  .summary-block h3 {
    margin: 0 0 8px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--primary);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .summary-block p {
    margin: 0 0 14px;
    white-space: pre-wrap;
    font-size: 14px;
  }
  .summary-block p:last-child { margin-bottom: 0; }

  .section-summary-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 10px;
    margin-bottom: 28px;
  }
  .section-summary-tile {
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .sst-label {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 6px;
  }
  .sst-score {
    font-family: var(--display);
    font-size: 30px;
    line-height: 1;
  }
  .sst-score.good { color: var(--good); }
  .sst-score.warn { color: var(--warn); }
  .sst-score.bad { color: var(--bad); }
  .sst-score small {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-soft);
  }

  .section-block {
    border: 1px solid var(--line);
    border-radius: 10px;
    margin-bottom: 14px;
    overflow: hidden;
  }
  .section-block-head {
    background: var(--bg);
    padding: 14px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .section-block-head h2 {
    margin: 0;
    font-family: var(--display);
    font-size: 22px;
    color: var(--secondary);
    text-transform: uppercase;
  }
  .section-block-head .score {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--primary);
    background: var(--bg-3);
    padding: 5px 11px;
    border-radius: 999px;
    font-weight: 700;
  }
  .section-block-body { padding: 16px 20px; }
  .group-block {
    margin-bottom: 14px;
  }
  .group-block h3 {
    margin: 0 0 6px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--secondary);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .item-line {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 14px;
    padding: 6px 0;
    font-size: 13.5px;
    border-bottom: 1px dotted var(--line);
  }
  .item-line:last-child { border-bottom: none; }
  .item-line .pill {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 700;
    padding: 2px 9px;
    border-radius: 999px;
    min-width: 36px;
    text-align: center;
  }
  .pill.s-0 { background: #ff6b6b; color: var(--bg); }
  .pill.s-1 { background: #ff8a5b; color: var(--bg); }
  .pill.s-2 { background: #f5c266; color: var(--bg); }
  .pill.s-3 { background: #d8e07a; color: var(--bg); }
  .pill.s-4 { background: #c5e87a; color: var(--bg); }
  .pill.s-5 { background: var(--primary); color: var(--bg); }
  .pill.s-na { background: #5a5a64; color: var(--ink); }
  .pill.s-none { background: var(--bg-3); color: var(--ink-soft); }

  .group-note {
    background: var(--bg);
    border-left: 3px solid var(--primary);
    padding: 10px 14px;
    margin-top: 8px;
    font-size: 13px;
    font-style: italic;
    color: var(--ink-soft);
  }

  /* ---- Mobile ---- */
  @media (max-width: 640px) {
    header.hero { padding: 16px 14px; }
    .hero-inner { gap: 10px; flex-wrap: wrap; }
    .hero-logo { width: 36px; height: 36px; }
    .hero-text h1 { font-size: 22px; }
    .hero-text p { font-size: 9px; }
    .nav-link {
      margin-left: 0;
      width: 100%;
      text-align: center;
      padding: 10px;
      order: 99;
    }

    main { padding: 0 14px; margin: 16px auto 60px; }

    .toolbar { gap: 6px; }
    #search { min-width: 0; width: 100%; padding: 10px 12px; font-size: 14px; }
    #typeFilter, .ghost-btn, .primary-btn {
      flex: 1;
      padding: 10px 10px;
      font-size: 10px;
      text-align: center;
    }

    .grid {
      grid-template-columns: 1fr;
      gap: 10px;
    }
    .audit-card { padding: 14px; }
    .ac-church { font-size: 18px; }
    .ac-meta { font-size: 10px; margin-bottom: 10px; }
    .ac-score { font-size: 30px; }

    .report-wrap { padding: 18px; }
    .report-head { gap: 14px; padding-bottom: 16px; margin-bottom: 18px; }
    .report-head h1 { font-size: 26px; }
    .report-head .meta { font-size: 11px; }
    .report-head .overall { text-align: left; }
    .report-head .overall-num { font-size: 56px; }

    .summary-block { padding: 14px 16px; }
    .summary-block p { font-size: 13px; }

    .section-summary-grid {
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }
    .section-summary-tile { padding: 10px 12px; }
    .sst-score { font-size: 24px; }

    .section-block-head { padding: 12px 14px; }
    .section-block-head h2 { font-size: 18px; }
    .section-block-body { padding: 12px 14px; }
    .item-line { font-size: 12.5px; padding: 5px 0; gap: 10px; }
    .group-block h3 { font-size: 10px; }
    .group-note { font-size: 12px; padding: 8px 12px; }
  }

  /* ---- BIG SPLASH OFFER BLOCKS ---- */
  .rec-block {
    margin: 18px 0 6px;
    background: linear-gradient(180deg, rgba(239,248,139,0.04), transparent);
    border: 1px solid rgba(239,248,139,0.25);
    border-radius: 10px;
    padding: 16px 18px;
  }
  .rec-block-head {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.25em;
    text-transform: uppercase; color: var(--primary);
    margin-bottom: 12px;
  }
  .rec-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .rec-card {
    background: var(--bg-2); border: 1px solid var(--line);
    border-radius: 8px; padding: 12px 14px;
  }
  .rec-card-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 6px; }
  .rec-card-name { font-family: var(--display); font-size: 16px; color: #fff; text-transform: uppercase; letter-spacing: 0.01em; }
  .rec-card-price { font-family: var(--mono); font-size: 11px; font-weight: 700; color: var(--primary-ink); background: var(--primary); padding: 3px 9px; border-radius: 999px; }
  .rec-card-summary { font-size: 12px; color: var(--ink); line-height: 1.5; margin-bottom: 6px; }
  .rec-card-fixes { font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; color: var(--ink-soft); text-transform: uppercase; }

  .audio-moat {
    margin: 36px 0 24px;
    background: linear-gradient(180deg, rgba(239,248,139,0.08), var(--bg-2));
    border: 1px solid rgba(239,248,139,0.5);
    border-radius: 12px;
    padding: 28px 30px;
    position: relative;
    overflow: hidden;
  }
  .audio-moat::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
    background: var(--primary);
  }
  .audio-moat-eyebrow { font-family: var(--mono); font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--primary); }
  .audio-moat h2 { font-family: var(--display); font-size: 38px; color: #fff; text-transform: uppercase; letter-spacing: 0.005em; margin: 10px 0 12px; line-height: 1.05; }
  .audio-moat p { font-size: 14px; color: var(--ink); line-height: 1.55; margin: 0 0 18px; max-width: 64ch; }
  .audio-moat-row { display: flex; justify-content: space-between; align-items: center; gap: 18px; padding-top: 18px; border-top: 1px solid rgba(239,248,139,0.25); }
  .audio-moat-name .amn-label { font-family: var(--mono); font-size: 9px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--ink-soft); }
  .audio-moat-name .amn-title { font-family: var(--display); font-size: 22px; color: #fff; text-transform: uppercase; margin: 4px 0; }
  .audio-moat-name .amn-sub { font-family: var(--mono); font-size: 10px; color: var(--ink-soft); letter-spacing: 0.05em; }
  .audio-moat-price { font-family: var(--display); font-size: 50px; color: var(--primary); line-height: 1; }

  .offer-section { margin: 36px 0 24px; }
  .offer-section-title {
    font-family: var(--display); font-size: 28px; color: var(--primary);
    text-transform: uppercase; margin: 0 0 6px; letter-spacing: 0.005em;
  }
  .offer-section-sub { font-size: 13px; color: var(--ink); margin: 0 0 16px; line-height: 1.5; }

  .offer-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .offer-card {
    background: var(--bg-2); border: 1px solid var(--line);
    border-radius: 10px; padding: 16px 18px;
  }
  .offer-card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 8px; }
  .offer-card h3 { font-family: var(--display); font-size: 18px; color: #fff; text-transform: uppercase; margin: 0; line-height: 1.1; letter-spacing: 0.005em; }
  .offer-price { font-family: var(--mono); font-size: 12px; font-weight: 700; color: var(--primary-ink); background: var(--primary); padding: 4px 10px; border-radius: 999px; flex-shrink: 0; }
  .offer-summary { font-size: 12.5px; color: var(--ink); line-height: 1.5; margin: 0 0 10px; }
  .offer-rec-for { font-family: var(--mono); font-size: 10px; letter-spacing: 0.05em; color: var(--ink-soft); padding-top: 8px; border-top: 1px dashed var(--line); }
  .offer-rec-for em { color: var(--primary); font-style: normal; }

  .rh-tier-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .rh-tier-card {
    background: var(--bg-2); border: 1px solid var(--line);
    border-radius: 10px; padding: 18px 18px;
    position: relative;
  }
  .rh-tier-card.featured { border-color: rgba(239,248,139,0.5); background: linear-gradient(180deg, rgba(239,248,139,0.05), var(--bg-2)); }
  .rh-tier-badge {
    position: absolute; top: -10px; left: 14px;
    background: var(--primary); color: var(--primary-ink);
    font-family: var(--mono); font-size: 9px; letter-spacing: 0.3em;
    text-transform: uppercase; font-weight: 700;
    padding: 3px 10px; border-radius: 999px;
  }
  .rh-tier-name { font-family: var(--mono); font-size: 9px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--primary); }
  .rh-tier-card h3, .rh-tier-card .name-big {
    font-family: var(--display); font-size: 22px; color: #fff;
    text-transform: uppercase; margin: 4px 0;
  }
  .rh-tier-price { font-family: var(--display); font-size: 32px; color: var(--primary); line-height: 1; }
  .rh-tier-price small { font-family: var(--mono); font-size: 10px; letter-spacing: 0.15em; color: var(--ink); margin-left: 4px; }
  .rh-tier-buyer { font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-soft); margin: 12px 0; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
  .rh-tier-card ul { margin: 0; padding: 0; list-style: none; }
  .rh-tier-card li { font-size: 12px; color: var(--ink); padding: 4px 0 4px 16px; position: relative; line-height: 1.4; }
  .rh-tier-card li::before { content: "✓"; color: var(--primary); position: absolute; left: 0; font-weight: 700; }

  .day-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .day-card { background: var(--bg-2); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; border-left: 3px solid var(--primary); }
  .day-label { font-family: var(--mono); font-size: 10px; letter-spacing: 0.25em; text-transform: uppercase; color: var(--primary); }
  .day-title { font-family: var(--display); font-size: 22px; color: #fff; text-transform: uppercase; margin: 6px 0 8px; }
  .day-body { font-size: 12.5px; color: var(--ink); line-height: 1.5; }

  .final-cta {
    margin: 36px 0 24px;
    background: linear-gradient(180deg, rgba(239,248,139,0.06), var(--bg));
    border: 1px solid rgba(239,248,139,0.4);
    border-radius: 12px;
    padding: 36px 32px;
    text-align: center;
  }
  .final-cta h2 { font-family: var(--display); font-size: 42px; color: #fff; text-transform: uppercase; margin: 0 0 14px; letter-spacing: 0.005em; }
  .final-cta p { font-size: 14px; color: var(--ink); line-height: 1.55; margin: 0 auto 22px; max-width: 56ch; }
  .final-cta-btn {
    display: inline-block;
    background: var(--primary); color: var(--primary-ink);
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.25em; text-transform: uppercase; font-weight: 700;
    padding: 16px 28px; border-radius: 999px; text-decoration: none;
  }

  @media (max-width: 768px) {
    .rec-cards, .offer-grid, .rh-tier-grid, .day-grid { grid-template-columns: 1fr !important; }
    .audio-moat-row { flex-direction: column; align-items: flex-start; }
    .audio-moat-price { font-size: 40px; }
    .audio-moat h2 { font-size: 28px; }
  }

  /* ---- Print ---- */
  @media print {
    @page { size: letter; margin: 0.5in; }
    body { background: white; color: #131318; }
    header.hero, .toolbar, #backBtn, .nav-link, .print-btn { display: none !important; }
    main { margin: 0; padding: 0; max-width: none; }
    .report-wrap {
      background: white;
      border: none;
      padding: 0;
    }
    .report-head h1 { color: #131318; }
    .report-head .overall-num.good { color: #4caf50; }
    .report-head .overall-num.warn { color: #e2a23b; }
    .report-head .overall-num.bad { color: #d04545; }
    .report-head .meta, .report-head .meta strong, .summary-block p,
    .section-block-head h2, .group-block h3, .item-line, .sst-label,
    .group-note { color: #131318 !important; }
    .summary-block, .section-summary-tile, .section-block, .section-block-head,
    .group-note {
      background: white !important;
      border-color: #ccc !important;
    }
    .summary-block h3, .section-block-head .score { color: #1a6b3a !important; }
    .section-block { page-break-inside: avoid; }
    .pill.s-0 { background: #d04545 !important; color: white !important; }
    .pill.s-1 { background: #d76a3a !important; color: white !important; }
    .pill.s-2 { background: #e2a23b !important; color: white !important; }
    .pill.s-3 { background: #b9b13a !important; color: white !important; }
    .pill.s-4 { background: #6aae4a !important; color: white !important; }
    .pill.s-5 { background: #1ea672 !important; color: white !important; }
    .pill.s-na { background: #999 !important; color: white !important; }
    .sst-score.good { color: #1ea672 !important; }
    .sst-score.warn { color: #e2a23b !important; }
    .sst-score.bad { color: #d04545 !important; }
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;

    /* Offer blocks in print */
    .rec-block, .audio-moat, .offer-card, .rh-tier-card, .day-card, .final-cta {
      background: white !important; border: 1px solid #ccc !important;
    }
    .rec-block-head, .offer-section-title, .audio-moat-eyebrow,
    .rh-tier-name, .day-label { color: #1a6b3a !important; }
    .audio-moat h2, .final-cta h2, .day-title, .rh-tier-card h3,
    .offer-card h3, .rec-card-name { color: #131318 !important; }
    .audio-moat p, .final-cta p, .day-body, .offer-summary,
    .rec-card-summary, .rh-tier-card li, .offer-section-sub { color: #131318 !important; }
    .rh-tier-buyer, .rec-card-fixes, .offer-rec-for { color: #555 !important; }
    .audio-moat-price, .rh-tier-price { color: #1a6b3a !important; }
    .rec-card-price, .offer-price, .rh-tier-badge, .final-cta-btn {
      background: #1a6b3a !important; color: white !important;
    }
    .rec-block, .audio-moat, .offer-section, .final-cta { page-break-inside: avoid; }
  }
</style>
</head>
<body>

<header class="hero">
  <div class="hero-inner">
    <div class="hero-logo"><img src="logo.svg" alt="Bigsplash" /></div>
    <div class="hero-text">
      <h1>Audit Reports</h1>
      <p>View and export submitted church audits</p>
    </div>
    <a href="./" class="nav-link">+ New Audit</a>
  </div>
</header>

<main>
  <div id="list-view">
    <div class="toolbar">
      <input type="text" id="search" placeholder="Search by church name…" />
      <select id="typeFilter">
        <option value="all">All types</option>
        <option value="Full">Full only</option>
        <option value="Digital">Digital only</option>
      </select>
      <button class="ghost-btn" id="refreshBtn">↻ Refresh</button>
    </div>
    <div id="grid" class="grid"></div>
    <div id="loading" class="loading">Loading…</div>
    <div id="empty" class="empty" style="display:none">No audits yet. Submit one from the audit page.</div>
  </div>

  <div id="report-view" style="display:none">
    <div class="toolbar">
      <button class="ghost-btn" id="backBtn">← Back to all audits</button>
      <button class="primary-btn print-btn" id="printBtn">🖨 Save as PDF</button>
    </div>
    <div id="report-content" class="report-wrap"></div>
  </div>
</main>

<script>
const ENDPOINT = "https://script.google.com/macros/s/AKfycbzSwX2eHHNMjASxeJhrRHkg-f_dZRDEEjARyZDjusfA4gr_RGj9bTWs_Fj4uIznw5VeAA/exec";

let allAudits = [];

// ============ BIG SPLASH OFFER CATALOG ============
const OFFERS = {
  "Brand Identity Refresh": {
    price: "$5,997", type: "project",
    summary: "Logo, color, type, and template system that holds across every doc and slide.",
    triggers: ["brand color","color spec","logo clear","favicon","brand mark","brand guide","document header","document footer","print spec","pantone","tagline","positioning","apparel","welcome packet","first-time visitor"]
  },
  "First Impression Website Rebuild": {
    price: "$3,497", type: "project",
    summary: "A site built around the first-time guest. Plan a Visit, sermons, giving, branded 404.",
    triggers: ["website","404","meta title","og image","heading and body","buttons","tagline","footer has correct"]
  },
  "Signage + Wayfinding Plan": {
    price: "$2,997", type: "project",
    summary: "Exterior sign rework plus interior wayfinding that connects parking lot to seat.",
    triggers: ["exterior signage","window decals","lobby","wayfinding","door signs","wall art","mural"]
  },
  "Sermon Series Launch Package": {
    price: "$2,497", type: "project",
    summary: "Per-series artwork that travels from stage to social to website.",
    triggers: ["sermon series","series graphic","cover","banner","pinned post","series art","lower thirds template"]
  },
  "Stage Design Refresh Consult": {
    price: "$2,497", type: "project",
    summary: "Stage backdrop and motion-graphics consult. Quarterly evolution plan.",
    triggers: ["stage backdrop","stage design","stage screen","scrim"]
  },
  "Vision Sunday Video": {
    price: "$3,497", type: "project",
    summary: "A 3-minute story film that anchors the year's vision.",
    triggers: ["vision","testimony video"]
  },
  "Annual Report Video": {
    price: "$7,997", type: "project",
    summary: "Board-room caliber recap film. Numbers, stories, vision.",
    triggers: ["annual report"]
  },
  "Capital / Giving Campaign Video": {
    price: "$5,997", type: "project",
    summary: "The film that gets the next pledge made.",
    triggers: ["capital","giving","pledge"]
  },
  "Children's / Youth Ministry Branding": {
    price: "$3,497", type: "project",
    summary: "Sub-brand system for kids and youth that lives under the main church brand.",
    triggers: ["children","youth","kids","ministry brand"]
  },
  "Easter or Christmas Promo Campaign": {
    price: "$4,497", type: "project",
    summary: "Full seasonal campaign. Series art, promo video, social pack, ads, follow-up flow.",
    triggers: ["easter","christmas","seasonal campaign"]
  },
  "Audio System Audit": {
    price: "$4,997", type: "audit", featured: true,
    summary: "On-site sound system measurement, mix analysis, EQ tuning, FOH operator training.",
    triggers: ["audio mix","stream audio","mix balance","audio levels","lipsync","levels target","peak ceiling","foh","ambience","backup audio","audio network","crowd mics"]
  },
  "Brand Governance Kit": {
    price: "$1,997", type: "project",
    summary: "Brand guide, asset library, vendor list, named owner, quarterly review cadence.",
    triggers: ["brand guide","asset library","old logo","vendor list","audit owner","review cadence"]
  },
};

const RETAINERS = [
  { name: "Reach", price: "$1,997", buyer: "Comms director with a Plan-a-Visit KPI",
    includes: ["Meta ads (Plan-a-Visit campaigns)", "Sermon edits + 4 vertical clips/mo", "Weekly highlight reel", "Content calendar + GBP mgmt", "Monthly performance report"] },
  { name: "Reach + Experience", price: "$3,997", buyer: "Executive pastor coordinating worship + comms",
    includes: ["Everything in Reach", "Livestream support + audio consulting", "On-camera coaching", "Monthly testimony video", "8 reels / month", "Quarterly experience review"] },
  { name: "Full Presence", price: "$6,997", buyer: "Lead pastor at 600+ church",
    includes: ["Everything in Reach + Experience", "Dedicated producer (single POC)", "Quarterly in-person visit (travel in)", "1 brand film + 4 testimonies + 12 reels / mo", "Annual brand health audit", "Pastor monthly studio shoot"] },
];

// Score is "weak" if 1-3 (not 4, 5, or N/A)
function isWeak(score) {
  if (score === null || score === undefined || score === "" || score === "na") return false;
  const n = Number(score);
  return !isNaN(n) && n >= 1 && n <= 3;
}

// Returns a list of { offer, item } pairs for items in this group that are weak and match offer triggers
function recommendOffersForItems(items) {
  const recs = new Map(); // offerName -> [items it solves]
  items.forEach(it => {
    if (!isWeak(it.score)) return;
    const itemTextLower = (it.item || "").toLowerCase();
    Object.entries(OFFERS).forEach(([name, offer]) => {
      if (offer.triggers.some(t => itemTextLower.includes(t.toLowerCase()))) {
        if (!recs.has(name)) recs.set(name, []);
        recs.get(name).push(it.item);
      }
    });
  });
  return recs; // Map<offerName, [item strings]>
}

function recommendOffersForAudit(allItems) {
  const recs = new Map();
  allItems.forEach(it => {
    if (!isWeak(it.score)) return;
    const itemTextLower = (it.item || "").toLowerCase();
    Object.entries(OFFERS).forEach(([name, offer]) => {
      if (offer.triggers.some(t => itemTextLower.includes(t.toLowerCase()))) {
        if (!recs.has(name)) recs.set(name, []);
        recs.get(name).push(it.item);
      }
    });
  });
  return recs;
}

function pickRetainerTier(overall) {
  if (overall === null || overall === undefined || overall === "") return "Reach + Experience";
  const n = Number(overall);
  if (n < 70) return "Full Presence";
  if (n < 85) return "Reach + Experience";
  return "Reach";
}

function scoreClass(pct) {
  if (pct === null || pct === undefined || pct === "") return "";
  if (pct >= 80) return "good";
  if (pct >= 60) return "warn";
  return "bad";
}

function formatDate(s) {
  if (!s) return "";
  try {
    const d = new Date(s);
    if (isNaN(d)) return s;
    return d.toLocaleDateString("en-US", { year: "numeric", month: "short", day: "numeric" });
  } catch { return s; }
}

async function loadAudits() {
  const grid = document.getElementById("grid");
  const loading = document.getElementById("loading");
  const empty = document.getElementById("empty");
  loading.style.display = "block";
  empty.style.display = "none";
  grid.innerHTML = "";

  try {
    const res = await fetch(ENDPOINT + "?action=list", { method: "GET" });
    const data = await res.json();
    // Filter out broken/legacy rows where Overall /100 is out of range (column-shift bugs)
    const cleaned = (data || []).filter(r => {
      const s = r["Overall /100"];
      if (s === "" || s === null || s === undefined) return true;
      const n = Number(s);
      return !isNaN(n) && n >= 0 && n <= 100;
    });
    allAudits = cleaned.reverse();
    loading.style.display = "none";
    if (!allAudits.length) { empty.style.display = "block"; return; }
    renderList(allAudits);

    // Deep link: ?id=<submittedAt> opens that specific report
    const params = new URLSearchParams(location.search);
    const id = params.get("id");
    if (id) {
      const idx = allAudits.findIndex(a => String(a["Submitted At"]) === id);
      if (idx >= 0) showReport(idx);
    }
  } catch (err) {
    loading.style.display = "none";
    empty.textContent = "Couldn't load audits. Check connection or endpoint setup.";
    empty.style.display = "block";
    console.error(err);
  }
}

function getType(a) {
  return (a["Type"] || a["type"] || "Full").toString();
}

function renderList(list) {
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  list.forEach((a, idx) => {
    const realIdx = allAudits.indexOf(a);
    const score = a["Overall /100"];
    const cls = scoreClass(score);
    const type = getType(a);
    const badgeCls = type.toLowerCase() === "digital" ? "digital" : "full";
    const card = document.createElement("div");
    card.className = "audit-card";
    card.innerHTML = `
      <span class="type-badge ${badgeCls}">${type}</span>
      <h3 class="ac-church">${a["Church"] || "Untitled"}</h3>
      <div class="ac-meta">${formatDate(a["Date"])} · ${a["Auditor"] || "—"}${a["Location"] ? " · " + a["Location"] : ""}</div>
      <div class="ac-score-row">
        <span class="ac-score ${cls}">${score ?? "—"}</span>
        <span class="ac-score-lbl">/ 100</span>
      </div>
    `;
    card.addEventListener("click", () => showReport(realIdx));
    grid.appendChild(card);
  });
}

function applyFilters() {
  const q = document.getElementById("search").value.toLowerCase();
  const typeF = document.getElementById("typeFilter").value;
  const filtered = allAudits.filter(a => {
    const churchMatch = (a["Church"] || "").toLowerCase().includes(q);
    const typeMatch = typeF === "all" || getType(a) === typeF;
    return churchMatch && typeMatch;
  });
  renderList(filtered);
}

document.getElementById("search").addEventListener("input", applyFilters);
document.getElementById("typeFilter").addEventListener("change", applyFilters);
document.getElementById("refreshBtn").addEventListener("click", loadAudits);

function showReport(idx) {
  const a = allAudits[idx];
  if (!a) return;
  document.getElementById("list-view").style.display = "none";
  document.getElementById("report-view").style.display = "block";
  window.scrollTo(0, 0);

  let items = [];
  let notes = [];
  try { items = JSON.parse(a["Items (JSON)"] || "[]"); } catch {}
  try { notes = JSON.parse(a["Notes (JSON)"] || "[]"); } catch {}

  // group items by section then by group
  const bySection = {};
  items.forEach(i => {
    if (!bySection[i.section]) bySection[i.section] = {};
    if (!bySection[i.section][i.group]) bySection[i.section][i.group] = [];
    bySection[i.section][i.group].push(i);
  });

  // section scores from header columns ending in " /5"
  const sectionScores = {};
  Object.keys(a).forEach(k => {
    if (k.endsWith(" /5")) {
      const label = k.slice(0, -3);
      sectionScores[label] = a[k];
    }
  });

  const score = a["Overall /100"];
  const cls = scoreClass(score);

  const typeStr = getType(a);
  const typeBadgeCls = typeStr.toLowerCase() === "digital" ? "digital" : "full";

  let html = `
    <div class="report-head">
      <div class="left">
        <span class="type-badge ${typeBadgeCls}">${typeStr} Audit</span>
        <h1>${a["Church"] || "Untitled"}</h1>
        <div class="meta">
          <strong>Audit Date:</strong> ${formatDate(a["Date"])}<br>
          <strong>Auditor:</strong> ${a["Auditor"] || "—"}<br>
          <strong>Location:</strong> ${a["Location"] || "—"}<br>
          ${a["Avg Attendance"] ? `<strong>Avg Attendance:</strong> ${a["Avg Attendance"]}<br>` : ""}
          ${a["Service Times"] ? `<strong>Services Observed:</strong> ${a["Service Times"]}<br>` : ""}
          <strong>Submitted:</strong> ${formatDate(a["Submitted At"])}
        </div>
      </div>
      <div class="overall">
        <div class="overall-num ${cls}">${score ?? "—"}</div>
        <div class="overall-lbl">Overall / 100</div>
      </div>
    </div>
  `;

  if (a["Top Fixes"] || a["Opportunity"] || a["Next Step"]) {
    html += `<div class="summary-block">`;
    if (a["Top Fixes"]) html += `<h3>Priority Recommendations</h3><p>${escapeHtml(a["Top Fixes"])}</p>`;
    if (a["Opportunity"]) html += `<h3>Bigsplash Opportunity</h3><p>${escapeHtml(a["Opportunity"])}</p>`;
    if (a["Next Step"]) html += `<h3>Recommended Next Step</h3><p>${escapeHtml(a["Next Step"])}</p>`;
    html += `</div>`;
  }

  // Section summary tiles
  if (Object.keys(sectionScores).length) {
    html += `<div class="section-summary-grid">`;
    Object.entries(sectionScores).forEach(([label, sc]) => {
      const pct = (typeof sc === "number") ? Math.round(sc / 5 * 100) : null;
      const cls2 = scoreClass(pct);
      const display = (sc === null || sc === undefined || sc === "") ? "—" : (typeof sc === "number" ? sc.toFixed(1) : sc);
      html += `
        <div class="section-summary-tile">
          <div class="sst-label">${label}</div>
          <div class="sst-score ${cls2}">${display}<small> / 5</small></div>
        </div>
      `;
    });
    html += `</div>`;
  }

  // Detailed sections
  const allItems = [];
  Object.entries(bySection).forEach(([sec, groups]) => {
    const secScore = sectionScores[sec];
    const secScoreDisplay = (typeof secScore === "number") ? secScore.toFixed(1) + " / 5" : "— / 5";
    html += `
      <div class="section-block">
        <div class="section-block-head">
          <h2>${sec}</h2>
          <span class="score">${secScoreDisplay}</span>
        </div>
        <div class="section-block-body">
    `;
    const sectionItems = [];
    Object.entries(groups).forEach(([groupName, groupItems]) => {
      html += `<div class="group-block"><h3>${groupName}</h3>`;
      groupItems.forEach(it => {
        sectionItems.push(it);
        allItems.push(it);
        const v = it.score;
        const pillCls = (v === null || v === undefined) ? "s-none" : (v === "na" ? "s-na" : `s-${v}`);
        const pillText = (v === null || v === undefined) ? "—" : (v === "na" ? "N/A" : v);
        html += `
          <div class="item-line">
            <div>${escapeHtml(it.item)}</div>
            <div class="pill ${pillCls}">${pillText}</div>
          </div>
        `;
      });
      const note = notes.find(n => n.group === `${sec} :: ${groupName}`);
      if (note) {
        html += `<div class="group-note">${escapeHtml(note.note)}</div>`;
      }
      html += `</div>`;
    });

    // Per-section recommended fixes from Big Splash
    const sectionRecs = recommendOffersForItems(sectionItems);
    if (sectionRecs.size > 0) {
      html += `<div class="rec-block"><div class="rec-block-head">Recommended fixes from Big Splash</div><div class="rec-cards">`;
      sectionRecs.forEach((items, name) => {
        const offer = OFFERS[name];
        html += `
          <div class="rec-card">
            <div class="rec-card-head">
              <span class="rec-card-name">${name}</span>
              <span class="rec-card-price">${offer.price}</span>
            </div>
            <div class="rec-card-summary">${escapeHtml(offer.summary)}</div>
            <div class="rec-card-fixes">Fixes ${items.length} weak ${items.length === 1 ? 'item' : 'items'} in this section</div>
          </div>
        `;
      });
      html += `</div></div>`;
    }

    html += `</div></div>`;
  });

  // ============ FINAL OFFER BLOCKS ============
  const auditRecs = recommendOffersForAudit(allItems);
  const audioMatched = auditRecs.has("Audio System Audit");
  const projects = Array.from(auditRecs.entries())
    .filter(([name]) => OFFERS[name].type === "project")
    .sort((a, b) => b[1].length - a[1].length);

  if (audioMatched) {
    const audioCount = auditRecs.get("Audio System Audit").length;
    html += `
      <div class="audio-moat">
        <div class="audio-moat-eyebrow">Special engagement · Bigsplash moat</div>
        <h2>Audio is the moat.</h2>
        <p>Your audit flagged ${audioCount} audio item${audioCount === 1 ? '' : 's'} at 3 of 5 or below. No church marketing agency in the country offers audio consulting as a core service. Big Splash does. Fifteen plus years of live-sound expertise, on-site measurement, and mix tuning that no graphic designer can copy.</p>
        <div class="audio-moat-row">
          <div class="audio-moat-name">
            <div class="amn-label">Standalone</div>
            <div class="amn-title">Audio System Audit</div>
            <div class="amn-sub">On-site measurement · Mix analysis · EQ tuning · 30-day follow-up</div>
          </div>
          <div class="audio-moat-price">$4,997</div>
        </div>
      </div>
    `;
  }

  if (projects.length > 0) {
    html += `<div class="offer-section"><h2 class="offer-section-title">Project menu</h2>`;
    html += `<p class="offer-section-sub">Each project maps to a finding above. Pricing is fixed and includes the full deliverable.</p>`;
    html += `<div class="offer-grid">`;
    projects.forEach(([name, items]) => {
      const offer = OFFERS[name];
      html += `
        <div class="offer-card">
          <div class="offer-card-head">
            <h3>${name}</h3>
            <span class="offer-price">${offer.price}</span>
          </div>
          <p class="offer-summary">${escapeHtml(offer.summary)}</p>
          <div class="offer-rec-for">Recommended for: <em>${escapeHtml(items.slice(0, 2).join(' · '))}${items.length > 2 ? ` · +${items.length - 2} more` : ''}</em></div>
        </div>
      `;
    });
    html += `</div></div>`;
  }

  const recommendedTier = pickRetainerTier(score);
  html += `<div class="offer-section"><h2 class="offer-section-title">Ongoing engagement</h2>`;
  html += `<p class="offer-section-sub">Three tiers. Annual prepay gets two months free. Recommended for this church: <strong style="color:var(--primary);">${recommendedTier}</strong>.</p>`;
  html += `<div class="rh-tier-grid">`;
  RETAINERS.forEach(tier => {
    const featured = tier.name === recommendedTier ? ' featured' : '';
    html += `
      <div class="rh-tier-card${featured}">
        ${featured ? '<div class="rh-tier-badge">Recommended</div>' : ''}
        <div class="rh-tier-name">${tier.name}</div>
        <div class="rh-tier-price">${tier.price}<small>/mo</small></div>
        <div class="rh-tier-buyer">For: ${tier.buyer}</div>
        <ul>
          ${tier.includes.map(i => `<li>${i}</li>`).join('')}
        </ul>
      </div>
    `;
  });
  html += `</div></div>`;

  html += `
    <div class="offer-section">
      <h2 class="offer-section-title">Your 30 / 60 / 90</h2>
      <p class="offer-section-sub">Quick wins in month one. Foundation in month two. Compounding in month three.</p>
      <div class="day-grid">
        <div class="day-card"><div class="day-label">Days 01 – 30</div><div class="day-title">Quick Wins</div><div class="day-body">Lock governance. Ship favicon, 404, social cover artwork, and a refreshed bulletin template. Every fix lands in one Sunday cycle.</div></div>
        <div class="day-card"><div class="day-label">Days 31 – 60</div><div class="day-title">Build the Foundation</div><div class="day-body">Brand guide, document templates, livestream backgrounds, visitor packet redesign. Train the comms team on the guide.</div></div>
        <div class="day-card"><div class="day-label">Days 61 – 90</div><div class="day-title">Scale + Compound</div><div class="day-body">Exterior signage installs around a low-traffic Sunday. Re-audit at day 90. Set the quarterly cadence on the calendar.</div></div>
      </div>
    </div>
  `;

  html += `
    <div class="final-cta">
      <h2>Patch the bucket.</h2>
      <p>Ads bring guests through the door. Brand decides whether they stay. Apply your audit credit toward month-one retainer if signed in 30 days.</p>
      <a href="https://bigsplash.video" class="final-cta-btn">Book the planning call →</a>
    </div>
  `;

  document.getElementById("report-content").innerHTML = html;
}

function escapeHtml(s) {
  if (s === null || s === undefined) return "";
  return String(s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
  })[c]);
}

document.getElementById("backBtn").addEventListener("click", () => {
  document.getElementById("report-view").style.display = "none";
  document.getElementById("list-view").style.display = "block";
});
document.getElementById("printBtn").addEventListener("click", () => window.print());

loadAudits();
</script>
</body>
</html>
